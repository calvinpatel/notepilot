# The free tiers (spec §11): lint, format, types, deterministic tests on every push.
# The model corpus is NOT here — it spends real money; manual dispatch only.
name: ci

on: [push]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The database tests run against this Postgres (spec §11, L345). NOTEPILOT_REQUIRE_DB
    # makes a missing one fail them rather than skip, so CI can't pass without them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/notepilot_test
      NOTEPILOT_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # uv reads .python-version and installs that interpreter itself. --locked fails
      # the job if uv.lock is stale instead of silently re-resolving.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy backend/ tests/
      - run: uv run pytest
