# The free tiers (spec §11): lint, format, types, deterministic tests on every push; beside
# them, the deploy's image, built and booted (L353).
# The model corpus is NOT here — it spends real money; manual dispatch only.
name: ci

on: [push]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The database tests run against this Postgres (spec §11, L345). NOTEPILOT_REQUIRE_DB
    # makes a missing one fail them rather than skip, so CI can't pass without them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/notepilot_test
      NOTEPILOT_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # uv reads .python-version and installs that interpreter itself. --locked fails
      # the job if uv.lock is stale instead of silently re-resolving.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy backend/ tests/ alembic/
      - run: uv run pytest

  # The frontend (spec §9.10, §11; L360): installed from the lock, its types regenerated from
  # the OpenAPI snapshot and compared, type-checked, tested, and built.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Generated, never hand-edited (§9.10): a regenerated api.d.ts that differs from the
      # committed one, or a committed one gone, leaves a status line and fails the job.
      - name: api.d.ts is what the snapshot generates
        run: |
          npm run gen:api
          git status --porcelain -- src/api.d.ts
          test -z "$(git status --porcelain -- src/api.d.ts)"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The deploy's image (spec §11, L353): built, booted with a dummy key, and checked. It needs
  # Docker, so it runs here and not among the gates a session runs locally (CLAUDE.md).
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ci-image-dummy-key
    steps:
      - uses: actions/checkout@v7
      # A working tree holds a .env, bytecode caches, and the frontend's node_modules and dist;
      # a checkout holds none of them. Plant each, so the allowlist has something to keep out.
      - name: Plant a .env, a bytecode cache, node_modules, and a dist
        run: |
          echo "ANTHROPIC_API_KEY=planted-dotenv-key" > .env
          mkdir -p backend/__pycache__ frontend/node_modules frontend/dist
          touch backend/__pycache__/planted.pyc frontend/node_modules/planted frontend/dist/planted
      - name: The build context is the allowlist
        run: |
          docker build --output "type=local,dest=$RUNNER_TEMP/context" --file - . <<'EOF'
          FROM scratch
          COPY . /
          EOF
          ls -A "$RUNNER_TEMP/context" | LC_ALL=C sort > "$RUNNER_TEMP/context.txt"
          diff - "$RUNNER_TEMP/context.txt" <<'EOF'
          .python-version
          backend
          frontend
          pyproject.toml
          uv.lock
          EOF
          ls -A "$RUNNER_TEMP/context/frontend" | LC_ALL=C sort > "$RUNNER_TEMP/frontend.txt"
          diff - "$RUNNER_TEMP/frontend.txt" <<'EOF'
          .npmrc
          index.html
          package-lock.json
          package.json
          src
          tsconfig.json
          vite.config.ts
          EOF
          test -z "$(find "$RUNNER_TEMP/context" -name __pycache__)"
      - name: Build
        run: docker build --tag notepilot .
      - name: Boot; /health and the page answer 200
        run: |
          docker run --detach --name server --publish 127.0.0.1:8000:8000 --env ANTHROPIC_API_KEY notepilot
          timeout 30 bash -c 'until curl --silent --fail --max-time 2 --output /dev/null http://127.0.0.1:8000/health; do sleep 1; done'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/health)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/)" = 200
      - name: The page is the bundle, revalidated; its script is cached for good
        run: |
          curl --silent --fail --dump-header "$RUNNER_TEMP/page.headers" --output "$RUNNER_TEMP/page.html" http://127.0.0.1:8000/
          grep --quiet --ignore-case '^cache-control: no-cache' "$RUNNER_TEMP/page.headers"
          script="$(grep --only-matching '/assets/[A-Za-z0-9._-]*\.js' "$RUNNER_TEMP/page.html" | head -n 1)"
          test -n "$script"
          curl --silent --fail --dump-header "$RUNNER_TEMP/script.headers" --output /dev/null "http://127.0.0.1:8000$script"
          grep --quiet --ignore-case '^content-type: text/javascript' "$RUNNER_TEMP/script.headers"
          grep --quiet --ignore-case '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/script.headers"
      - name: uid 10001, the base's Python, no .env, tests/, or cache, only the bundle, no Node
        run: |
          test "$(docker run --rm notepilot id -u)" = 10001
          docker run --rm notepilot /app/.venv/bin/python -c 'import sys; print(sys.base_prefix, "%d.%d" % sys.version_info[:2])' > "$RUNNER_TEMP/python.txt"
          echo "/usr/local $(cat .python-version)" | diff - "$RUNNER_TEMP/python.txt"
          docker run --rm notepilot sh -c 'test ! -e /app/.env && test ! -e /app/tests && test ! -e /app/backend/__pycache__'
          test "$(docker run --rm notepilot ls -A /app/frontend)" = dist
          docker run --rm notepilot sh -c 'test ! -e /app/frontend/dist/planted && ! command -v node'
      - name: A trust of * stops the boot, exit 1, by name and without the key
        run: |
          status=0
          timeout 30 docker run --rm --env ANTHROPIC_API_KEY --env 'FORWARDED_ALLOW_IPS=*' notepilot > "$RUNNER_TEMP/refused.txt" 2>&1 || status=$?
          test "$status" = 1
          grep --quiet forwarded_allow_ips_any "$RUNNER_TEMP/refused.txt"
          if grep --quiet --fixed-strings "$ANTHROPIC_API_KEY" "$RUNNER_TEMP/refused.txt"; then
            echo "the refused boot printed the key"
            exit 1
          fi
      - name: SIGTERM stops the server, exit 0
        run: |
          docker stop server
          test "$(docker inspect --format '{{.State.ExitCode}}' server)" = 0
      - name: The server's log
        if: failure()
        run: docker logs server
