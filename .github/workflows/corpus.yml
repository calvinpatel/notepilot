# The model corpus on demand (spec §11, D5, L213, L393): python -m backend.corpus, a dry run
# unless spend is checked, and with it the run's record uploaded as an artifact. It spends
# real money, so it runs only when dispatched, and it reads the API key, which ci.yml never
# reads (§10).
name: corpus

on:
  workflow_dispatch:
    inputs:
      spend:
        description: "Make the API calls (costs money). Unchecked: a dry run."
        type: boolean
        default: false
      judge:
        description: "Judge each repeat's claims (more API calls)."
        type: boolean
        default: false

permissions:
  contents: read

# A second dispatch waits for the first: two runs on one key contend for its rate limit, and
# the contention lands in the record's wall times and failures (L202).
concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-24.04
    # Far above a run's minutes: a cancelled run loses its record, written last (§8.7).
    timeout-minutes: 60
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "the corpus runs from main; this dispatch named $GITHUB_REF"
          exit 1
      # This job holds the key, so each action is pinned to a commit, its release tag beside
      # it; ci.yml holds no secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Without the dev group, here and in the run below: a bare uv run would sync it again.
      - run: uv sync --locked --no-dev
      # The key reaches this step and no other. RUNS_PATH is outside the checkout, so the
      # record never joins the tracked file (D5).
      - name: python -m backend.corpus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS_PATH: ${{ runner.temp }}/corpus_run.jsonl
          SPEND: ${{ inputs.spend }}
          JUDGE: ${{ inputs.judge }}
        run: |
          args=()
          if [ "$SPEND" = true ]; then args+=(--spend); fi
          if [ "$JUDGE" = true ]; then args+=(--judge); fi
          uv run --locked --no-dev python -m backend.corpus "${args[@]}"
      - name: Upload the record
        if: inputs.spend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-run
          path: ${{ runner.temp }}/corpus_run.jsonl
          if-no-files-found: error
          retention-days: 90
