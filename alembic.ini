# Alembic's configuration (spec §9.8, D3; L346). Committed, so it names no database: env.py
# takes the URL from settings.database_url, which carries the password.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# The logging below is the command line's: env.py applies it only when it opens its own
# connection, so a test's migration leaves the suite's logging as it was.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
