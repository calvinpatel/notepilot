[project]
name = "notepilot"
version = "0.1.0"
description = "Clinical-encounter → grounded, safety-checked SOAP summarizer."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.9,<2",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
# Ruff formats fenced Python in Markdown by default. The spec's code blocks are annotated
# prose, not source; without this, `ruff format` would rewrite PROJECT_01_NOTEPILOT.md.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF100"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
venvPath = "."
venv = ".venv"
