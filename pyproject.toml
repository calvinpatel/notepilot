[project]
name = "notepilot"
version = "0.1.0"
description = "Clinical-encounter → grounded, safety-checked SOAP summarizer."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.9,<2",
    "asyncpg>=0.32.0",
    "fastapi>=0.141.1",
    "limits>=5.8.0",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "ruamel-yaml>=0.19.1,<0.20",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# an empty parametrize fails at collection instead of reporting a skip: an empty corpus, or
# a roster with no CRITICAL check, can't pass quietly
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 100
target-version = "py314"
# Ruff formats fenced Python in Markdown by default. The spec's code blocks are annotated
# prose, not source; without this, `ruff format` would rewrite PROJECT_01_NOTEPILOT.md.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF100"]

# alembic/ at the root (§13, D3) would make ruff file the installed alembic as first-party.
[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
venvPath = "."
venv = ".venv"
